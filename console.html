<!DOCTYPE html>
<html lang="en">

<head>
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <link rel="icon" href="download__12_-removebg-preview.png" type="image/x-icon" />
    <style>
        body {
            background-color: lightpink;
            border-style: rigid;
            border-width: 10px;
            border-radius: 50px;
            border-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        button {
            background-color: black;
            color: white;
            border: 2px solid #333;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: #444;
            transform: scale(1.05);
        }

        button:active {
            background-color: #666;
            transform: scale(1);
        }

        /* Style for custom "Choose File" button */
        #customFileInput {
            background-color: black;
            color: white;
            border: 2px solid #333;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #customFileInput:hover {
            background-color: #444;
            transform: scale(1.05);
        }

        #customFileInput:active {
            background-color: #666;
            transform: scale(1);
        }

        /* Hide the actual file input button */
        input[type="file"] {
            display: none;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        label {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="button-container">
        <button onclick="navigateToPage()">BACK TO GAME</button>
        <button id="tumama">Get lots of CCS</button>
        <button id="clear">Reset CCS</button>
        <button id="wipe">WIPE ALL CCS</button>
        <button id="double">INFINITE *WARNING IS PERMANENT*</button>
        <button id="x2">Get your x2 bonus</button>
        <button id="any">Set ANY amount</button>
        <button id="export">Export</button>
        <button id="stadium">Stadium</button>
        <button id="training">Training</button>
        <button id="rehab">Rehab</button>
        <button id="qb">QB Mode</button>
        <button id="fr">FR Mode</button>
    </div>

    <!-- Custom File Input -->
    <div class="center">
        <label for="importFile" id="customFileInput">Choose File</label>
        <input type="file" id="importFile" accept=".txt" />
        <button id="import">Import Data</button>
    </div>

    <div class="center">
        <label for="saveFile">Enter Save File Name to Delete:</label>
        <input type="text" id="saveFile" placeholder="e.g., RetroBowl.0.savedata.ini">
        <button id="deleteSave">Delete Save</button>
    </div>

    <script>
        // Navigate to a new page
        function navigateToPage() {
            window.location.href = "https://nightlock100.github.io/notaustin/index.html"; // Replace with your desired URL
        }

        // Handle the import functionality
        document.getElementById("import").onclick = () => {
            const fileInput = document.getElementById("importFile");
            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const importedData = event.target.result;
                    localStorage.setItem("RetroBowl.0.savedata.ini", importedData);
                    alert('Data imported successfully!');
                };
                reader.readAsText(file);
            } else {
                alert('Please select a file to import.');
            }
        };
    </script>
</body>

</html>
