<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LocalStorage Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input { width: 80%; }
        button { margin-left: 10px; padding: 5px 10px; }
        .active { background-color: #d1ffd1; } /* Highlight active file */
    </style>
</head>
<body>
    <h1>LocalStorage Inspector</h1>
    <button id="game">Back to Game</button>
    <button id="loadData">Load Local Storage Data</button>
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Value</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="storageTableBody"></tbody>
    </table>

    <script>
        const currentFileKey = 'RetroBowl.0.savedata.ini'; // The file currently used by the game

        document.getElementById("game").onclick = () => {
            window.location.href = "index.html";
        };

        document.getElementById("loadData").onclick = () => {
            const tableBody = document.getElementById("storageTableBody");
            tableBody.innerHTML = "";

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);

                const row = document.createElement("tr");
                if (key === currentFileKey) row.classList.add('active');

                const keyCell = document.createElement("td");
                const valueCell = document.createElement("td");
                const actionCell = document.createElement("td");

                keyCell.textContent = key;

                const input = document.createElement("input");
                input.type = "text";
                input.value = value;

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.onclick = () => {
                    localStorage.setItem(key, input.value);
                    alert(`Updated ${key}`);
                };

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.onclick = () => {
                    if (confirm(`Are you sure you want to delete ${key}?`)) {
                        localStorage.removeItem(key);
                        row.remove();
                    }
                };

                valueCell.appendChild(input);
                actionCell.appendChild(editButton);
                actionCell.appendChild(deleteButton);

                row.appendChild(keyCell);
                row.appendChild(valueCell);
                row.appendChild(actionCell);

                tableBody.appendChild(row);
            }

            if (localStorage.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 3;
                cell.textContent = "No data found in Local Storage.";
                row.appendChild(cell);
                tableBody.appendChild(row);
            }
        };
    </script>
</body>
</html>
